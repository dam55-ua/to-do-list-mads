<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Detalle de equipo')"></head>

<body>
<nav th:replace="fragments :: navbar"></nav>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Equipo: ' + ${equipo.nombre}"></h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <h3>Miembros</h3>

            <table class="table table-striped" th:if="${!#lists.isEmpty(usuarios)}">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Correo electrónico</th>
                    <th>Nombre</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.nombre}"></td>
                </tr>
                </tbody>
            </table>

            <div class="alert alert-info" th:if="${#lists.isEmpty(usuarios)}">
                Este equipo no tiene miembros.
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <form th:if="${!pertenece}" method="post"
                  th:action="@{/equipos/{id}/unirse(id=${equipo.id})}">
                <button type="submit" class="btn btn-primary">Unirme al equipo</button>
            </form>

            <form th:if="${pertenece}" method="post"
                  th:action="@{/equipos/{id}/salir(id=${equipo.id})}">
                <button type="submit" class="btn btn-danger">Salir del equipo</button>
            </form>
        </div>
    </div>

    <div class="row mt-2" th:if="${mensaje != null}">
        <div class="col">
            <div class="alert alert-success" th:text="${mensaje}"></div>
        </div>
    </div>

    <div class="row mt-2" th:if="${error != null}">
        <div class="col">
            <div class="alert alert-danger" th:text="${error}"></div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <a class="btn btn-link" th:href="@{/equipos}">Volver al listado</a>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
