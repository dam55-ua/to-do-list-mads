<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>

<body>
<nav th:replace="fragments :: navbar"></nav>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Usuarios registrados</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Correo electrónico</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td><a th:href="@{/registrados/{id}(id=${usuario.id})}">Ver descripción</a></td>
                    <td th:text="${usuario.bloqueado ? 'Bloqueado' : 'Habilitado'}"></td>
                    <td>
                        <form th:if="${!usuario.bloqueado && usuario.id != usuarioLogeado.id}" method="post"
                              th:action="@{/registrados/{id}/bloquear(id=${usuario.id})}">
                            <button class="btn btn-danger btn-sm" type="submit">Bloquear</button>
                        </form>
                        <form th:if="${usuario.bloqueado}" method="post"
                              th:action="@{/registrados/{id}/habilitar(id=${usuario.id})}">
                            <button class="btn btn-success btn-sm" type="submit">Habilitar</button>
                        </form>
                        <span th:if="${!usuario.bloqueado && usuario.id == usuarioLogeado.id}">
                            Administrador actual
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="row mt-2" th:if="${mensaje != null}">
        <div class="col">
            <div class="alert alert-success" role="alert" th:text="${mensaje}"></div>
        </div>
    </div>
    <div class="row mt-2" th:if="${error != null}">
        <div class="col">
            <div class="alert alert-danger" role="alert" th:text="${error}"></div>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
