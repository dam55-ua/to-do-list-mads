<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>
<nav th:replace="fragments :: navbar"></nav>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Equipos</h2>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col">
            <form method="post" th:action="@{/equipos}" class="form-inline">
                <input type="text" name="nombre" class="form-control mr-2"
                       placeholder="Nombre del equipo" required>
                <button type="submit" class="btn btn-primary">Crear equipo</button>
            </form>
        </div>
    </div>

    <div class="row mt-2" th:if="${mensaje != null}">
        <div class="col">
            <div class="alert alert-success" th:text="${mensaje}"></div>
        </div>
    </div>

    <div class="row mt-2" th:if="${error != null}">
        <div class="col">
            <div class="alert alert-danger" th:text="${error}"></div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped" th:if="${!#lists.isEmpty(equipos)}">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}"
                           th:text="${equipo.nombre}"></a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="alert alert-info" th:if="${#lists.isEmpty(equipos)}">
                No hay equipos disponibles.
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
