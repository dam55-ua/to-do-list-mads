<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

<!-- Barra de menú común a todas las páginas excepto login y registro.
     Usa el atributo "usuarioLogeado" (añadido por el ControllerAdvice)
     para decidir qué versión mostrar. -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
    <a class="navbar-brand" th:href="@{/about}">ToDoList</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarMenu"
            aria-controls="navbarMenu" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item" th:if="${usuarioLogeado != null}">
                <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${usuarioLogeado.id})}">Tareas</a>
            </li>
        </ul>

        <ul class="navbar-nav">
            <!-- Usuario logeado: desplegable con Cuenta y Cerrar sesión -->
            <li class="nav-item dropdown" th:if="${usuarioLogeado != null}">
                <a class="nav-link dropdown-toggle" href="#" id="navUsuario" role="button"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                   th:text="${usuarioLogeado.nombre}"></a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navUsuario">
                    <a class="dropdown-item" href="#">Cuenta</a>
                    <a class="dropdown-item" th:href="@{/logout}"
                       th:text="'Cerrar sesión ' + ${usuarioLogeado.nombre}"></a>
                </div>
            </li>
            <!-- Usuario no logeado: enlaces a login y registro (página "acerca de") -->
            <li class="nav-item" th:if="${usuarioLogeado == null}">
                <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item" th:if="${usuarioLogeado == null}">
                <a class="nav-link" th:href="@{/registro}">Registro</a>
            </li>
        </ul>
    </div>
</nav>

</html>
